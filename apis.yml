aid: manara
name: Manara
description: Manara is an upskilling and professional development platform focused on the Middle East
  and North Africa (MENA) region, specializing in training for emerging technologies including AI and
  cloud computing. It runs enterprise workforce-development programs, national government training
  initiatives, and individual learning and certification courses, connecting a community of MENA
  software engineers and technologists with global career opportunities. The company reports 300,000+
  learners trained, 2,500+ certifications awarded, operations across 40+ countries, and 500+ job
  placements. Manara publishes no public developer API surface as of this enrichment pass.
